name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify, test, pack, inspect, and smoke the release candidate
        id: release-version
        timeout-minutes: 19
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts/Invoke-ReleaseWorkflow.ps1
          -Mode Verify
          -Tag $env:GITHUB_REF_NAME
          -TagRevision $env:GITHUB_SHA

      - name: Upload validated packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages/feed
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to NuGet.org
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out exact verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET SDK for publishing
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish package and symbols through the bounded runner
        timeout-minutes: 8
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          pwsh -NoProfile -File scripts/Invoke-ReleaseWorkflow.ps1
          -Mode Publish
          -PackageVersion ${{ needs.verify.outputs.version }}
