name: Validate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify release workflow external-command routing
        shell: pwsh
        run: pwsh -NoProfile -File build/Test-ExternalCommandWorkflow.ps1

      - name: Verify hidden child PowerShell launch guard
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1 -SelfTest

      - name: Scan repository child PowerShell launches
        shell: pwsh
        run: ./build/Test-NestedPwshLaunch.ps1

      - name: Validate reachable commit history
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Validate-History.ps1 -Revision HEAD -RepositoryPath $env:GITHUB_WORKSPACE

      - name: Run full repository validation on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Validate.ps1 -Mode Full -ResilienceVersion 10.10.0

      - name: Run repository validation on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/validate-linux.sh

      - name: Run repository validation on macOS
        if: runner.os == 'macOS'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Validate.ps1 -Mode Full -ResilienceVersion 10.10.0

      - name: Run integration endpoint 9.8.0
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-IntegrationTests.ps1 -ResilienceVersion 9.8.0

      - name: Run integration endpoint 10.10.0
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-IntegrationTests.ps1 -ResilienceVersion 10.10.0

      - name: Report normalized package artifact hashes
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages/feed'
          foreach ($archive in @(
              (Join-Path $packageDirectory 'KeelMatrix.ResilienceSpec.0.1.0.nupkg'),
              (Join-Path $packageDirectory 'KeelMatrix.ResilienceSpec.0.1.0.snupkg')
          )) {
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Expected normalized package artifact was not found: $archive"
            }
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            Write-Output ("{0} SHA256={1}" -f (Split-Path -Leaf $archive), $hash)
          }
