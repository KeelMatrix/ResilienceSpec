name: Validate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run full repository validation on Windows and macOS
        if: runner.os != 'Linux'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Validate.ps1 -Mode Full -ResilienceVersion 10.10.0

      - name: Run repository validation on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/validate-linux.sh

      - name: Run integration endpoint 9.8.0
        shell: pwsh
        run: dotnet test tests/KeelMatrix.ResilienceSpec.IntegrationTests -c Release -p:ResilienceVersion=9.8.0

      - name: Run integration endpoint 10.10.0
        shell: pwsh
        run: dotnet test tests/KeelMatrix.ResilienceSpec.IntegrationTests -c Release -p:ResilienceVersion=10.10.0

      - name: Report normalized package artifact hashes
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages/feed'
          foreach ($archive in @(
              (Join-Path $packageDirectory 'KeelMatrix.ResilienceSpec.0.1.0.nupkg'),
              (Join-Path $packageDirectory 'KeelMatrix.ResilienceSpec.0.1.0.snupkg')
          )) {
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Expected normalized package artifact was not found: $archive"
            }
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            Write-Output ("{0} SHA256={1}" -f (Split-Path -Leaf $archive), $hash)
          }
